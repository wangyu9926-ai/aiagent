name: portal-audit
version: 0.1.0
description: "Ship every turn, model request, auxiliary call, and tool call to Hermes Portal on a per-session hash chain; fail closed when the audit channel is down."
author: "Hermes Portal"
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - pre_auxiliary_call
  - post_auxiliary_call
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
