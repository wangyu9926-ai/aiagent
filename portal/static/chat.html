<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Portal · 对话</title>
  <script src="/static/theme.js?v=0.1.1"></script>
  <link rel="stylesheet" href="/static/app.css?v=0.4.3">
</head>
<body class="app-body">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">HP</div>
      <div>
        <div class="brand-name">Hermes Portal</div>
        <div class="brand-sub">你的 AI 工作台</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="user-chip" id="user-chip">…</span>
      <a class="btn btn-ghost btn-sm" id="dashboard-link" href="/dashboard" hidden>监管台</a>
      <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">退出</button>
    </div>
  </header>

  <main class="chat-shell">
    <aside class="panel chat-sidebar">
      <div class="chat-sidebar-head">
        <h2>对话</h2>
        <button class="btn btn-sm" id="new-conversation" type="button">新会话</button>
      </div>
      <div class="field chat-tenant-field">
        <span>租户</span>
        <div class="select-control">
          <button class="select-trigger" id="tenant-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="tenant-menu" disabled>
            <span id="tenant-label">加载中…</span>
            <span class="select-caret" aria-hidden="true">⌄</span>
          </button>
          <div class="select-menu" id="tenant-menu" role="listbox" aria-label="选择租户" hidden></div>
        </div>
      </div>
      <div class="skill-picker" id="skill-picker">
        <div class="skill-picker-head">
          <span>技能</span>
          <span class="small muted" id="skill-selected-label">未选择</span>
        </div>
        <div class="skill-list" id="skill-list"></div>
      </div>
      <div class="memory-panel" id="memory-panel">
        <div class="local-bridge-head">
          <span>记忆</span>
          <span class="badge" id="memory-badge">0</span>
        </div>
        <div class="small muted" id="memory-hint">私有记忆只对你可见；团队记忆全组可见。</div>
        <div class="local-bridge-actions">
          <button class="btn btn-sm" id="memory-manage" type="button">管理记忆</button>
        </div>
      </div>
      <div class="local-bridge" id="local-bridge">
        <div class="local-bridge-head">
          <span>本地文件夹</span>
          <span class="badge" id="local-badge">未连接</span>
        </div>
        <div class="small muted" id="local-hint">授权一个目录后，Agent 会读写它的服务器副本；改完点“同步回本地”。</div>
        <div class="local-bridge-actions">
          <button class="btn btn-sm" id="local-connect" type="button">连接文件夹</button>
          <button class="btn btn-sm btn-primary" id="local-sync" type="button" hidden>同步回本地</button>
          <button class="btn btn-sm btn-danger" id="local-disconnect" type="button" hidden>断开</button>
        </div>
      </div>
      <div class="conversation-list" id="conversation-list"></div>
      <div class="side-note">
        对话和文件处理过程会留痕，方便之后回溯；高风险操作会先请你或管理员确认。
      </div>
    </aside>

    <section class="panel chat-main">
      <div class="chat-head">
        <div>
          <h2 id="chat-title">选择或新建会话</h2>
          <span class="muted small" id="chat-sub"></span>
        </div>
        <span class="badge" id="chat-status">未开始</span>
      </div>

      <div class="messages" id="messages"></div>

      <form class="chat-composer" id="composer">
        <div class="composer-attachments" id="selected-skills" hidden></div>
        <div class="composer-attachments" id="pending-attachments" hidden></div>
        <div class="composer-row">
          <button class="btn btn-ghost attach-btn" id="attach-btn" type="button" title="添加文件" disabled>📎</button>
          <input type="file" id="file-input" multiple hidden>
          <textarea id="chat-input" rows="3" placeholder="正在加载会话…" autocomplete="off" disabled></textarea>
          <button class="btn btn-primary" id="send-btn" type="button" disabled>发送</button>
        </div>
      </form>
      <p class="error" id="chat-error" role="alert" hidden></p>
    </section>
  </main>

  <div class="modal" id="memory-modal" role="dialog" aria-modal="true" aria-labelledby="memory-modal-title" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="memory-modal-title">记忆</h2>
        <button class="btn btn-sm" id="memory-modal-close" type="button">关闭</button>
      </div>
      <div class="modal-body memory-modal-body">
        <div class="memory-list" id="memory-list"></div>
        <label class="field memory-input-field">
          <span>新增记忆</span>
          <textarea id="memory-input" rows="3" maxlength="4000" placeholder="例如：本部门的销售额以财务确认口径为准"></textarea>
        </label>
        <div class="memory-compose">
          <div class="memory-scope-toggle" role="group" aria-label="记忆范围">
            <button class="scope-option active" data-scope="private" type="button">私有</button>
            <button class="scope-option" data-scope="team" type="button">团队</button>
          </div>
          <button class="btn btn-primary btn-sm" id="memory-add" type="button">保存记忆</button>
        </div>
        <p class="small muted" id="memory-modal-hint">私有记忆只对当前用户可见；团队记忆全租户可见。</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/static/chat.js?v=0.4.3"></script>
</body>
</html>
